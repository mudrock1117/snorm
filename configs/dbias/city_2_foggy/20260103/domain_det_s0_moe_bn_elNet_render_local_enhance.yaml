MODEL:
  BACKBONE:
    NAME: 'resnet101'
  RPN:
    ANCHOR_SIZES: (64, 128, 256, 512)
  ROI_BOX_HEAD:
    NUM_CLASSES: 8
    BOX_PREDICTOR: 'resnet101_predictor'
    POOL_TYPE: 'align'
  MODE:
    USE_STUDENT: True
    INSRANCE_ADV: True
    UPDATE_TEACHER_ITERUM: 1
    NET_MOMENTUM: 1.0
    INIT_DIS_NET: 400
    
    TRAIN_PROCESS: 'S0'
    TEST_PROCESS: 'TC'
    PJOTYPE: 'NBIAS'
    
    UPDATE_STUDENT_MARK: True
    UPDATE_TEACHER_MARK: True
DATALOADER:
  NUM_WORKERS: 0
ADV:
  LAYERS: [False, False, True]
  DIS_MODEL:
    - in_channels: 512
      func_name: 'cross_entropy'
      pool_type: 'avg'
      loss_weight: 1.0
      window_strides: [2, 2, 2, 2, 2, 2, 2]
      window_sizes: [3, 9, 15, 21, 27, 33, 37]
DATASETS:
  TRAINS: ['bdd_daytime_clear_train']
  TARGETS: ['bdd_daytime_clear_train']
  #TESTS: ['bdd_daytime_clear_test','bdd_daytime_fog_test']
  #TESTS: ['bdd_daytime_clear_train',]
  TESTS: ['bdd_daytime_fog_test', 'bdd_night_sun_test']
INPUT:
  TRANSFORMS_TRAIN:
    - name: 'random_flip'
    # Raw-image enhancement is placed before resize/normalize.
    - name: 'local_adaptive_enhance'
      mode: 'both'
      prob: 0.5
      clip_limit: 1.5
      tile_grid_size: 8
      brightness_strength: 0.25
      target_luma: 105.0
      min_gain: 0.80
      max_gain: 1.25
      blur_ratio: 0.08
    - name: 'resize'
      min_size: 600
    - name: 'normalize'
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]
      to_01: True
    - name: 'collect'
  TRANSFORMS_TEST:
    # Deterministic test-time enhancement; compare against the unmodified baseline.
    - name: 'local_adaptive_enhance'
      mode: 'both'
      prob: 1.0
      clip_limit: 1.5
      tile_grid_size: 8
      brightness_strength: 0.25
      target_luma: 105.0
      min_gain: 0.80
      max_gain: 1.25
      blur_ratio: 0.08
    - name: 'resize'
      min_size: 600
    - name: 'normalize'
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]
      to_01: True
    - name: 'collect'
SOLVER:
  EPOCHS: 5
  STEPS: (80000, 32000, 42000)
  LR: 1e-4
  BATCH_SIZE: 1
  GAMMA: 0.1
TEST:
  EVAL_TYPES: ['voc']

WORK_DIR: './debug_spatial_ablation/b1_train_5ep_local_adaptive_enhance'